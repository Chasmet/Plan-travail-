plugins {
    id 'com.android.application'
}

def autoVersionCode = (project.findProperty('AUTO_VERSION_CODE') ?: '1') as Integer
def autoVersionName = project.findProperty('AUTO_VERSION_NAME') ?: '1.0.0'
def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD')

configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'com.chasmet.plantravail'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.plantravail'
        minSdk 21
        targetSdk 34
        versionCode autoVersionCode
        versionName autoVersionName
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStoreFile != null) storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
