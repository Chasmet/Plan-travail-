name: Android APK + mise à jour interne

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Intégrer le tunnel HTTPS public ARM64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 \
            -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          file app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          test -s app/src/main/jniLibs/arm64-v8a/libcloudflared.so

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Compiler APK release non signée
        run: ./gradlew assembleRelease -PAUTO_VERSION_CODE=${{ github.run_number }} -PAUTO_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Récupérer la clé publique de test Android permanente
        run: |
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o "$RUNNER_TEMP/testkey.pk8"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o "$RUNNER_TEMP/testkey.x509.pem"

      - name: Signer toujours avec la même clé
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --key "$RUNNER_TEMP/testkey.pk8" \
            --cert "$RUNNER_TEMP/testkey.x509.pem" \
            --out "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk"

      - name: Vérifier le tunnel dans l'APK
        run: |
          unzip -l "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk" | grep 'lib/arm64-v8a/libcloudflared.so'

      - name: Publier Artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PlanTravail-Orsay-v1.0.${{ github.run_number }}
          path: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publier dans le circuit de mise à jour interne
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan Travail Orsay v1.0.${{ github.run_number }}
          body: |
            Mise à jour automatique de Plan Travail Orsay.
            Le serveur MCP intégré crée désormais lui-même une adresse HTTPS publique sans clé API ni authentification.
            Toutes les versions utilisent la même signature Android afin de conserver les données.
          files: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          make_latest: true
