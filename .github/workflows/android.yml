name: Android APK + mise à jour interne

on:
  push:
    branches: [ main, fix/audit-2026-09-10 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Tester les corrections et contrôler Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --max-workers=2

      - name: Compiler APK release non signée
        run: ./gradlew assembleRelease -PAUTO_VERSION_CODE=${{ github.run_number }} -PAUTO_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Récupérer la clé publique de test Android permanente
        run: |
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o "$RUNNER_TEMP/testkey.pk8"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o "$RUNNER_TEMP/testkey.x509.pem"

      - name: Signer toujours avec la même clé
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --key "$RUNNER_TEMP/testkey.pk8" \
            --cert "$RUNNER_TEMP/testkey.x509.pem" \
            --out "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk"

      - name: Vérifier la continuité du certificat de signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Check the exact certificate passed to apksigner, independent of CLI display formats.
          openssl x509 -in "$RUNNER_TEMP/testkey.x509.pem" -outform DER -out "$RUNNER_TEMP/signing-cert.der"
          ACTUAL_CERT=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f1)
          test "$ACTUAL_CERT" = "$(cat .github/signing-certificate.sha256)"

      - name: Vérifier absence de tunnel tiers
        run: |
          if unzip -l "PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk" | grep -qi cloudflared; then
            echo "Dépendance Cloudflare détectée" >&2
            exit 1
          fi

      - name: Publier Artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PlanTravail-Orsay-v1.0.${{ github.run_number }}
          path: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Rapports de vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/verification/
          if-no-files-found: warn

      - name: Publier dans le circuit de mise à jour interne
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan Travail Orsay v1.0.${{ github.run_number }}
          body: |
            Zoom approfondi jusqu’à 24, fond vectoriel net et détails hors ligne.
            Appui prolongé sur +/−, curseur de zoom précis, échelle en mètres et cadrage mémorisé.
            Interface compacte, plein écran, recherche avec suggestions et fiche de rue.
            Dessins en plusieurs traits avec zoom à deux doigts et brouillon conservé à la rotation.
            Dessins inclus dans les sauvegardes, migration des anciens tracés et annulation.
            PDF au fond historique conservé, sans déformation du plan.
            Même certificat : installer par-dessus la version actuelle pour conserver les données.
            Tests Android, Lint et contrôle de signature exécutés avant publication.
          files: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          make_latest: true
