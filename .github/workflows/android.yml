name: Android APK + mise à jour interne

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier la clé permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 absent" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD absent" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS absent" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD absent" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plantravail-release.jks"

      - name: Préparer Gradle
        run: chmod +x gradlew

      - name: Compiler APK release avec signature permanente
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/plantravail-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PAUTO_VERSION_CODE=${{ github.run_number }} -PAUTO_VERSION_NAME=1.0.${{ github.run_number }}

      - name: Renommer APK
        run: cp app/build/outputs/apk/release/app-release.apk PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk

      - name: Publier Artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PlanTravail-Orsay-v1.0.${{ github.run_number }}
          path: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publier dans le circuit de mise à jour interne
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan Travail Orsay v1.0.${{ github.run_number }}
          body: |
            Mise à jour automatique signée de Plan Travail Orsay.
            La même clé Android permanente est réutilisée pour toutes les versions afin de conserver les données locales.
          files: PlanTravail-Orsay-v1.0.${{ github.run_number }}.apk
          make_latest: true
